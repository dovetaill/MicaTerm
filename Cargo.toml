[package]
name = "mica-term-gpui"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/dovetaill/MicaTerm"
description = "Mica Term — GPU-accelerated Terminal, SSH & SFTP Workspace powered by GPUI Kit & Alacritty Terminal"
license = "MIT"

[lib]
name = "mica_term_gpui"
path = "src/lib.rs"

[[bin]]
name = "mica-term-gpui"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.102"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
directories = "5"
gpui-kit = "0.10.0"
keyring = "3.6.3"
parking_lot = "0.12"
portable-pty = "0.9.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
redb = "2"
regex = "1"
rfd = "0.17.2"
russh = "0.65"
russh-sftp = "2.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[patch.crates-io]
gpui-pre-windows = { path = "patches/gpui-pre-windows" }
