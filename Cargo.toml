[package]
name = "mica-term"
version = "0.1.0"
edition = "2024"

[features]
default = ["slint-renderer-software"]
slint-renderer-software = ["slint/renderer-software"]

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
directories = "5"
keyring = "3.6.3"
redb = "2"
rfd = "0.17.2"
russh = "0.58.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
i-slint-backend-selector = "1.15.1"
slint = { version = "1.15.1", default-features = false, features = [
    "std",
    "backend-winit-x11",
    "compat-1-2",
    "unstable-winit-030",
] }
termwiz = "0.23.3"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
wezterm-surface = { package = "tattoy-wezterm-surface", version = "0.1.0-fork.2" }
wezterm-term = { package = "tattoy-wezterm-term", version = "0.1.0-fork.5" }
window-vibrancy = "0.7.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.15.1"
winresource = "0.1.19"

[dev-dependencies]
filetime = "0.2"
i-slint-backend-testing = "1.15.1"

[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
